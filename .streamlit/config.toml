[client]
toolbarMode = "minimal"

[server]
enableStaticServing = true

[theme]
base = "dark"
primaryColor = "#c6f135"
backgroundColor = "#0b1f17"
secondaryBackgroundColor = "#12301f"
textColor = "#eef5ef"
borderColor = "#2a4a38"
font = "Barlow, system-ui, sans-serif"
headingFont = "'Barlow Condensed', Barlow, system-ui, sans-serif"
baseFontSize = 18
headingFontSizes = ["2.4rem", "1.6rem", "1.35rem"]
headingFontWeights = [700, 700, 600]
metricValueFontSize = "2.4rem"
metricValueFontWeight = 700
baseRadius = "0.6rem"
showWidgetBorder = true
paddingTop = "2.5rem"
paddingBottom = "2rem"
blueColor = "#4b93ea"
orangeColor = "#e96630"
grayColor = "#9fb0a6"
dataframeHeaderBackgroundColor = "#12301f"
dataframeHeaderTextColor = "#eef5ef"
dataframeBorderColor = "#2a4a38"

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/barlow-latin-400.woff2"
weight = 400
unicodeRange = "U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD"

[[theme.fontFaces]]
family = "Barlow"
url = "app/static/fonts/barlow-latin-ext-400.woff2"
weight = 400
unicodeRange = "U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF"

