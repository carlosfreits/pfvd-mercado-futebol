[project]
name = "pfvd-mercado-futebol"
version = "0.1.0"
description = "Produto de visualização para decisão de contratação com orçamento limitado (GDCOC0096/UFPB)"
requires-python = ">=3.11,<3.14"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "plotly>=5.24",
  "streamlit>=1.40",
  "rapidfuzz>=3.9",
  "unidecode>=1.3",
  "kaleido>=1",
  "requests>=2.31",
  "python-dotenv>=1.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = [".", "collect/api_football", "collect/transfermarkt_datasets"]
testpaths = ["tests"]
